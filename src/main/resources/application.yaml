spring:
  application:
    name: tech_sys

  datasource:
    url: jdbc:postgresql://localhost:5432/tech_sys_db
    username: admin
    password: 55005
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # usa flyway
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      name: admin
      password: admin

  jwt:
    secret: ${JWT_SECRET:minha-chave-secreta-super-segura-assistencia-tecnica-2024}
    expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE